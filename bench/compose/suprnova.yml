# Benchmark SUT stack — deliberately isolated from anything already on the host.
#
# The host is a Coolify box carrying real deployments. Three things keep
# this stack away from them, and all three matter:
#
#   * its own project name (`suprnova-bench`), so compose can never adopt
#     or tear down a container it did not create here;
#   * its own named volumes, which compose prefixes with that project — a
#     soak writing hours of churn into a production database is an
#     incident, not a benchmark;
#   * its own port (18080), checked free before it was chosen.
#
# Nothing attaches to an existing network, and Postgres is not published
# at all: the SUT reaches it over the private compose network, so the only
# thing exposed to the host is the one port under test.
#
# cpusets come from BENCHMARK-SPEC.md, derived for the confirmed 16C/32T
# EPYC 4545P. The SUT is deliberately *not* given every core: saturating
# 16 cores needs so much offered load that the generator becomes the
# bottleneck, and the "knee" you then measure is your own load client
# giving up. 24-29 are reserved for the generator; the rest is left to the
# OS and the host's own workload.
#
# Only the services Phase 1 actually uses are here. Redis arrives when an
# experiment needs it (1.2 wants the scheduler run once per cache driver)
# and it will come with the bootstrap change that makes the cache driver
# selectable — inert configuration in a benchmark harness is a lie waiting
# to be believed.
#
# Everything past `sut` sits behind a profile, so `up -d` brings up exactly
# the HTTP system under test and nothing else. The daemons are started by
# the experiment that needs them, for as long as it needs them.

name: suprnova-bench

x-sut-env: &sut-env
  APP_NAME: "Suprnova Bench SUT"
  APP_ENV: production
  APP_DEBUG: "false"
  # Fixed so the stack is reproducible. This key is public, it guards
  # nothing, and it must never be copied anywhere that matters.
  #
  # No `base64:` prefix — Suprnova wants 32 bytes as URL-safe base64 with
  # no padding and rejects Laravel's prefixed form outright.
  APP_KEY: "RRrwmngzB7FxuDxTBkaaVLrRSN6t357twXfvUJwlZyk"
  APP_URL: "http://127.0.0.1:18080"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  DATABASE_URL: "postgres://bench:bench@db:5432/bench"
  DB_MAX_CONNECTIONS: "20"
  DB_MIN_CONNECTIONS: "5"
  DB_LOGGING: "false"
  LOG_LEVEL: warn
  # The queue experiments are about durable claiming across processes.
  # The memory driver would make every one of them vacuously pass, since
  # each process would own a private queue.
  QUEUE_DRIVER: database

  # Two production boot guards the framework refuses to start without an
  # explicit answer to. Both acknowledgements are *true* of this stack,
  # and neither would be true of a real deployment:
  #
  #   * exactly one process serves HTTP here, so a per-process rate-limit
  #     bucket really is the whole bucket. The moment Phase 2 scales the
  #     SUT this becomes a lie and has to move to Redis.
  #   * nothing in Phase 1 sends mail, and no experiment asserts delivery,
  #     so discarding it costs the results nothing.
  RATE_LIMIT_ALLOW_MEMORY_IN_PRODUCTION: "true"
  MAIL_ALLOW_NON_DELIVERING_IN_PRODUCTION: "true"

x-sut-image: &sut-image
  build:
    # Repo root — `app` is a workspace member, so cargo needs the whole
    # workspace present to resolve it.
    context: ../..
    dockerfile: bench/compose/Dockerfile.sut
  image: suprnova-bench-sut:latest
  depends_on:
    db:
      condition: service_healthy
  environment: *sut-env
  restart: "no"

services:
  db:
    image: postgres:18-alpine
    cpuset: "0-3"
    mem_limit: 8g
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
      # Durability traded for consistent numbers. Correct for a benchmark,
      # wrong for production — and recorded in the environment stanza so
      # nobody reads these figures as production-durable.
      - -c
      - synchronous_commit=off
    volumes:
      # Postgres 18 refuses to start against a volume mounted at
      # `.../data` — it now keeps a major-version subdirectory under
      # `/var/lib/postgresql` so `pg_upgrade --link` does not have to cross
      # a mount boundary. Mounting the old path aborts the entrypoint.
      - bench-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Never restart on its own: a container that comes back mid-run
    # silently changes what the run measured.
    restart: "no"

  sut:
    <<: *sut-image
    cpuset: "4-7"
    mem_limit: 2g
    ports:
      - "18080:8080"

  # `docker compose run --rm console <command>` — the enqueue and verify
  # halves of every queue experiment. Short-lived by construction, so it
  # gets no cpuset: pinning a process that runs for two seconds would only
  # steal cores from the thing being measured.
  console:
    <<: *sut-image
    profiles: ["tools"]
    entrypoint: ["console"]

  # Queue workers. Scaled by the experiment (`--scale worker=N`), so no
  # container_name — compose has to be free to number the replicas.
  worker:
    <<: *sut-image
    profiles: ["worker"]
    cpuset: "8-15"
    mem_limit: 2g
    command: ["app", "queue:work"]

  # Scheduler replicas for 1.2. Same image, same database, no coordination
  # configured — which is the question: does one tick fire once, or once
  # per replica?
  scheduler:
    <<: *sut-image
    profiles: ["scheduler"]
    cpuset: "8-15"
    mem_limit: 1g
    command: ["app", "schedule:work"]

volumes:
  bench-pgdata:
