# Ignored RustSec advisories.
#
# Every entry carries an OWNER and an EXPIRES date, and
# `scripts/check-audit.sh` FAILS the release gate once an entry is past
# its expiry. An exception with no expiry is a decision nobody revisits;
# an expiry nobody checks is the same thing with extra steps.
#
# Format, parsed by check-audit.sh - keep it exact:
#
#     # OWNER: name <email>
#     # EXPIRES: YYYY-MM-DD
#     "RUSTSEC-XXXX-XXXX",
#
# The reachability claims below are not on their honour:
# `scripts/check-feature-matrix.sh` asserts them against real resolved
# dependency trees (see its "RUSTSEC exception scope" block).
#
# This file used to carry five entries. The four rustls-webpki ones are
# gone because the dependency that caused them is gone: the Pinecone
# driver was rewritten against Pinecone's REST API, dropping
# `pinecone-sdk 0.1.2` and with it `tonic 0.11 -> rustls 0.22 ->
# rustls-webpki 0.102`. Deleting an exception beats renewing one.

[advisories]
ignore = [
    # ------------------------------------------------------------------
    # rkyv 0.7.46 - inactive rust_decimal compatibility dependency
    # ------------------------------------------------------------------
    # RUSTSEC-2026-0235 affects validation of untrusted archives that
    # contain shared unsized pointers. Suprnova does not compile rkyv or
    # process rkyv archives. Cargo.lock records it only because
    # rust_decimal 1.42.x declares an optional `rkyv` compatibility
    # feature, even though neither Suprnova nor another workspace member
    # enables that feature.
    #
    # There is no compatible upgrade to apply: rust_decimal intentionally
    # pins that optional compatibility surface to rkyv 0.7, while the
    # advisory is fixed only in rkyv >= 0.8.17. rust_decimal recommends
    # remote derives to applications that need rkyv 0.8; Suprnova needs
    # neither integration.
    #
    # `scripts/check-feature-matrix.sh` resolves every workspace member,
    # every workspace feature, every target, and every dependency edge,
    # then asserts that both rkyv and rkyv_derive are absent. If any future
    # dependency activates this dormant edge, the release gate fails before
    # cargo-audit reaches this exception.
    #
    # Exit: remove this exception when rust_decimal drops the optional 0.7
    # dependency or offers a stable line whose lockfile no longer records it.
    # OWNER: eas4ai <shawn@eas4ai.com>
    # EXPIRES: 2026-11-14
    "RUSTSEC-2026-0235",

    # ------------------------------------------------------------------
    # rsa 0.9.10 - Marvin timing attack
    # ------------------------------------------------------------------
    # Re-checked 2026-07-30 against advisory-db: `patched = []`. There is
    # still no fixed release. crates.io's newest `rsa` is 0.10.0-rc.18, a
    # pre-release the advisory does not list as patched either - so
    # "upgrade" is not an available action, not merely an inconvenient one.
    #
    # Reachability: real, and this one IS in the default dependency graph
    # - but by one path now, not four (`cargo tree -i rsa`, re-checked
    # 2026-07-31 after the Azure/GCS split):
    #
    #   sqlx-mysql 0.8.6            <- `database-mysql`, a default feature
    #
    # The three reqsign paths are gone from a default build. They were:
    #
    #   reqsign-core 3.1.0          <- opendal-core, but only with `jwt`
    #   reqsign-google 3.0.2        <- opendal-service-gcs
    #   reqsign-azure-storage 3.1.0 <- opendal-service-azblob
    #
    # `opendal-service-azblob` and `-gcs` moved behind the opt-in
    # `filesystem-azure` / `filesystem-gcs` features. They were the only
    # crates enabling `reqsign-core/jwt`, and `reqsign-core`'s `rsa` is
    # optional behind exactly that feature, so gating them severs all
    # three edges at once. `reqsign-core` itself is still in the graph via
    # `opendal-core`; without `jwt` it no longer reaches `rsa`.
    #
    # `services-s3` is deliberately still unconditional: `reqsign-aws-v4`
    # takes `reqsign-core` *without* `jwt`, so S3 never contributed a path
    # here. Gating it would have broken the most-used cloud backend and
    # removed nothing.
    #
    # The consequence worth stating plainly: `rsa` is now *avoidable*,
    # which it was not before. `--no-default-features --features
    # filesystem,database-postgres` resolves with no `rsa` at all and
    # still has the storage subsystem. A stock default build still has it,
    # because `database-mysql` is a default feature and `sqlx-mysql`
    # depends on `rsa` non-optionally - so this exception stays open.
    #
    # What bounds it is the operation, not the path. The advisory is a
    # timing side-channel against RSA *decryption* - it recovers the
    # private key from whoever decrypts. Neither path decrypts:
    #
    #   * sqlx-mysql *encrypts* the password with the server's public key
    #     during the `caching_sha2_password` / `sha256_password`
    #     handshake. The decryption is the MySQL server's, with the
    #     server's key.
    #   * reqsign uses `rsa` behind its optional `jwt` feature to *sign*
    #     Google service-account assertions (`reqsign/core/src/jwt.rs`).
    #
    # So this is not "vulnerable but bounded" - the vulnerable operation
    # is never performed here.
    #
    # An earlier version of this comment claimed the exit was to build
    # sqlx without the RSA handshake path. That was wrong: `rsa` is a
    # hard, non-optional dependency of `sqlx-mysql 0.8.6` (its manifest
    # has no feature gating it), so there is no such build. The only exit
    # from the remaining path is not to enable `database-mysql`.
    #
    # OWNER: eas4ai <shawn@eas4ai.com>
    # EXPIRES: 2027-01-31
    "RUSTSEC-2023-0071",
]
