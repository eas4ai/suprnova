<form id="form" live:submit.prevent="save"><label for="seats">Seats</label><input id="seats" name="seats" type="number" value="{{ seats }}" live:model="seats"><fieldset><legend>Topics</legend><label><input name="topics" type="checkbox" value="releases" live:model="topics"> Releases</label><label><input name="topics" type="checkbox" value="security" live:model="topics"> Security</label></fieldset><label for="name">Name</label><input id="name" name="name" type="text" value="{{ name }}" live:model="name"><output id="name-error" live:error.live.polite="name"></output><label for="contact">Contact</label><input id="contact" name="contact" type="email" value="{{ contact }}" live:model="contact"><output id="contact-error" live:error.live.polite="contact"></output><button type="submit">Save</button><button id="register" type="button" live:click="register">Register</button><button id="reserve" type="button" live:click="reserve(2)">Reserve two</button><p id="saves">{{ saves }}</p></form>
