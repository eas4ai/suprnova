<button id="bump" type="button" live:click="bump">{{ count }}</button>
<span id="app">{% if let Ok(name) = "app_name"|value::<String> %}{{ name }}{% else %}no app name{% endif %}</span>
<span id="viewer">{% if let Ok(viewer) = "viewer"|value::<String> %}{{ viewer }}{% else %}nobody{% endif %}</span>
