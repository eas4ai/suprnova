[package]
name = "suprnova"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A Laravel-inspired web framework for Rust"
repository = "https://github.com/entrepeneur4lyf/suprnova"
homepage = "https://github.com/entrepeneur4lyf/suprnova"
keywords = ["web", "framework", "async", "http", "server"]
categories = ["web-programming::http-server", "asynchronous"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1.4"
matchit = "0.9"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
suprnova-macros = { path = "../suprnova-macros", version = "0.6.2" }
dotenvy = "0.15"
inventory = "0.3"
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls"] }
thiserror = "2"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
validator = { version = "0.20", features = ["derive"] }
serde_urlencoded = "0.7"
pretty_assertions = "1.4"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.19.2"
rand = { version = "0.10", features = ["std", "std_rng"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry", "smallvec", "parking_lot"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "fast-rng", "serde"] }
dashmap = "6"
torii = { git = "https://github.com/entrepeneur4lyf/suprnova-torii-rs.git", default-features = false, features = ["password", "oauth", "passkey", "magic-link"] }
webauthn-rs = { version = "0.5", features = ["resident-key-support", "danger-allow-state-serialisation"] }
torii-core = { git = "https://github.com/entrepeneur4lyf/suprnova-torii-rs.git" }
torii-storage-seaorm = { git = "https://github.com/entrepeneur4lyf/suprnova-torii-rs.git", default-features = false }
# Apple Sign-In provider — used by torii_integration::oauth for Apple's
# JWT client secret, ID token verification (JWKS), and form_post flow.
# `auth` feature only; cloudkit/appstore attack surface is disabled.
apple = { git = "https://github.com/entrepeneur4lyf/suprnova-apple-rs.git", tag = "v0.3.1", default-features = false, features = ["auth"] }

# Pinned to versions sea-orm 1.1.x exposes via `with-rust_decimal` / `with-bigdecimal`.
# Used by the `pagination` module to round-trip `sea_orm::Value::Decimal` /
# `Value::BigDecimal` boundaries in cursor payloads.
rust_decimal = { version = "1", features = ["serde"] }
bigdecimal = "0.4"
once_cell = "1"

# OpenTelemetry — optional, gated behind the `otel` feature. Default OFF.
# Pinned to the 0.31.x line because `tracing-opentelemetry 0.32.1` (latest)
# still depends on `opentelemetry 0.31.0`. Mixing 0.31 and 0.32 fails to
# compile (different `Tracer` trait identity).
opentelemetry = { version = "0.31.0", optional = true, default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31.0", optional = true, default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", optional = true, default-features = false, features = ["http-proto", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "0.31.0", optional = true, default-features = false, features = ["log"] }
opentelemetry-http = { version = "0.31.0", optional = true, default-features = false }
opentelemetry-semantic-conventions = { version = "0.31.0", optional = true }
tracing-opentelemetry = { version = "0.32.1", optional = true }

# Phase 4 — filesystem, uploads, and validation
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
infer = "0.19"
multer = "3"
opendal = { version = "0.58.0", git = "https://github.com/entrepeneur4lyf/opendal.git", rev = "88717391eb72c9839d3f8e79fccad9f22fc3a1b4", optional = true, default-features = false, features = [
    "services-fs",
    "services-s3",
    "services-azblob",
    "services-gcs",
    "services-memory",
    # Production-grade middleware stack. Each `layers-*` feature pulls a
    # separate `opendal-layer-*` crate, which is why they're feature-gated
    # at all — without these flags the layer types aren't even reachable.
    # `layers-retry` (in 0.56 → `RetryLayer`): exponential-backoff retries
    #   on transient 5xx and throttling.
    # `layers-timeout` (`TimeoutLayer`): per-operation timeout.
    # `layers-logging` (`LoggingLayer`): debug-level structured logs for
    #   every operation.
    # `layers-tracing` (`TracingLayer`): `tracing` spans per operation;
    #   integrates with the framework's existing `tracing-subscriber` setup
    #   and (when the `otel` feature is on) the OTLP exporter.
    # `layers-prometheus-client` (`PrometheusClientLayer`): histograms +
    #   counters for the `prometheus-client` registry. We pick this over
    #   `layers-prometheus` because `prometheus-client` is the actively-
    #   maintained crate; the older `prometheus` crate is in maintenance
    #   mode.
    # OTel-specific layers (`layers-otel-trace` / `layers-otel-metrics`)
    # are intentionally NOT enabled here because they depend on the
    # `opentelemetry` crate and could drag in a version different from
    # the framework's pinned 0.31.x line, fracturing the `Tracer` trait
    # identity. If a consumer needs OpenTelemetry, the framework's `otel`
    # feature already wires the SDK and reqwest exporter; opendal's spans
    # surface through `TracingLayer` because `tracing-opentelemetry`
    # bridges them.
    "layers-retry",
    "layers-timeout",
    "layers-logging",
    "layers-tracing",
    "layers-prometheus-client",
] }
url = "2"
# Spill-to-disk backing for large multipart parts. Used at runtime when a
# single upload exceeds the in-memory spill threshold so the framework never
# materialises an arbitrarily large body in RAM.
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "multipart"] }
getrandom = "0.4.2"
tokio-util = { version = "0.7.18", features = ["time"] }
sea-streamer = { version = "0.5.0", features = ["redis", "stdio", "runtime-tokio", "socket", "json"], default-features = false }
sea-streamer-redis = { version = "0.5.2", features = ["runtime-tokio"] }
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "pool", "rustls-tls", "hostname", "builder", "tokio1", "tokio1-rustls"] }
tera = "1"
aws-sigv4 = "1"
suprnova-web-push = { version = "0.6.2", path = "../crates/suprnova-web-push", optional = true }
aws-credential-types = "1.2.14"
# Compatibility pin for fresh downstream resolutions: time 0.3.48 currently
# triggers coherence conflicts in sea-query/aws-smithy-types on Rust 1.96.
time = { version = "=0.3.47", default-features = false }
fake = { version = "5.1.0", features = ["chrono", "derive", "uuid"] }
envy = "0.4.2"
hyper-tungstenite = "0.20.0"
futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }
qrcode = "0.14"
featureflag = { version = "0.0.3", features = ["feature-registry", "futures"] }
async-stream = "0.3.6"
qdrant-client = "1.18.0"
# Pinecone driver dependencies — feature-gated behind `vector-pinecone`.
# As of pinecone-sdk 0.1.2 (latest on crates.io), the SDK pins
# `tonic 0.11.0 → tokio-rustls 0.25.0 → rustls 0.22.4 → rustls-webpki 0.102.8`,
# which has four active RustSec advisories (RUSTSEC-2026-0049, -0098,
# -0099, -0104). Making the dep optional means `cargo audit` is clean
# on the default feature set; consumers who need Pinecone opt in
# explicitly and accept the dep chain. See production-gate #370.
pinecone-sdk = { version = "0.1.2", optional = true }
prost-types = { version = "0.12", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio-rustls", "json"] }
iso_currency = { version = "0.5.3", features = ["with-serde"] }
percent-encoding = "2.3.2"
httpdate = "1.0.3"
argon2 = "0.5.3"
md-5 = "0.11.0"
sha1 = "0.11.0"
hex = "0.4.3"
digest = "0.11.3"
regex = "1.12.3"
hmac = "0.13"
subtle = "2"
zeroize = { version = "1.8.2", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false, features = ["syntect"] }
ammonia = "4.1.4"

[features]
default = [
    "testing",
    "filesystem",
    "database-sqlite",
    "database-postgres",
    "database-mysql",
    "vector-mariadb",
    "web-push",
]
# Exposes framework test hooks such as encryption-key installation and request
# query overrides. Filesystem fakes additionally require `filesystem`.
testing = []
# Enables the OpenDAL-backed filesystem facade and all supported storage
# backends. Kept in the default set for backward compatibility.
filesystem = ["dep:opendal"]
# Database drivers are mapped through SeaORM, migrations, and Torii so a
# consumer's selected backend is consistent across the framework stack.
database-sqlite = [
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
    "torii-storage-seaorm/sqlite",
]
database-postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
    "torii-storage-seaorm/postgres",
]
database-mysql = [
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
    "torii-storage-seaorm/mysql",
]
# Enables the direct-SQLx MariaDB vector driver. The MySQL database feature is
# required so SeaORM, migrations, Torii, and the vector driver agree.
vector-mariadb = ["dep:sqlx", "sqlx/mysql", "database-mysql"]
# Enables the browser web-push client and notification channel. Kept in the
# default set while allowing minimal builds to exclude its RSA implementation.
web-push = ["dep:suprnova-web-push"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-http",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
]
# Enables SeaStreamerBroadcastHub — cross-process fanout via sea-streamer.
# sea-streamer (with stdio backend) is already a base dep (required by the
# queue/redis driver). This feature gates only the fanout module itself,
# keeping the public API surface opt-in.
broadcasting-fanout = []
# Enables the Pinecone vector driver. Off by default because the
# upstream `pinecone-sdk 0.1.2` pulls `tonic 0.11.0` which has four
# active rustls-webpki RustSec advisories. Consumers who need Pinecone
# enable this feature explicitly; Qdrant + MariaDB + Memory drivers
# stay first-class without it. See `docs/core/vector.md`.
vector-pinecone = ["dep:pinecone-sdk", "dep:prost-types"]

[dev-dependencies]
# Smoke test for the `opendal::layers::PrometheusClientLayer` feature.
# Pinned to the same line opendal-layer-prometheus-client 0.58 builds
# against — different majors of `prometheus-client` would fracture the
# `Registry` type identity.
prometheus-client = "0.25"
serial_test = "3.4.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1", features = ["test-util"] }
tracing = "0.1"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
url = "2"
wiremock = "0.6"
