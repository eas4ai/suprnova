[package]
name = "suprnova-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for scaffolding Suprnova web applications"
repository = "https://github.com/eas4ai/suprnova"
homepage = "https://github.com/eas4ai/suprnova"
keywords = ["cli", "scaffold", "suprnova", "web", "generator"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "suprnova"
path = "src/main.rs"
# Skip rustdoc for the bin - the lib at `framework/suprnova` already
# emits docs at `target/doc/suprnova/`, and rustdoc tries to write
# this bin's doc to the same path (cargo issue #6313). The CLI's
# user-facing reference is `suprnova --help`, not docs.rs.
doc = false

[lib]
name = "suprnova_cli"
path = "src/lib.rs"
doctest = false

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
console = "0.16"
ctrlc = "3.5"
syn = { version = "2", features = ["full", "parsing", "visit"] }
# `generate-types --routes` walks `routes.rs` as tokens to follow nested
# `group!` prefixes. Already in the tree through `syn`. `span-locations`
# gives each parsed token its byte range, so `live:add` and `live:registry`
# edit `src/live/mod.rs` at the exact place `syn` found the registry
# builder and keep every other byte (REG-005), and the component scan names
# the line of every refusal (REG-022).
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
notify = "8.2"
dotenvy = "0.15"
# `generate-types` parses `lang/<locale>/*.ftl` catalogs into the
# `MessageKey` TS union (see `commands/generate_types.rs`). Independent of
# the framework's own (optional) `fluent-syntax` dep - the CLI links the
# `suprnova` crate without its default features (see the `suprnova` entry
# below), so this is its own minimal parse-only dependency.
fluent-syntax = "0.12"
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "postgres-use-serial-pk"] }
chrono = "0.4"
toml = "1.1.2"
regex = "1"
# `key:generate` mints a 32-byte AES-256 key encoded URL-safe-no-pad
# base64 - same wire format as `suprnova::EncryptionKey::to_base64`.
# The six primitives are duplicated rather than called through `suprnova`,
# which the CLI links only for the SSR commands (see the `suprnova` entry
# below).
rand = "0.10.1"
base64 = "0.22"
getrandom = "0.4.2"
# `dev:tls` fingerprints the CA certificate before installing it into a
# browser trust store, and pins that fingerprint so a CA that changes
# underneath the user has to be re-confirmed by a human.
sha2 = "0.10"
# `serve.rs` serializes `DevEvent` NDJSON events under `--json` at
# runtime, not just in tests, so both serde crates live here rather than
# in [dev-dependencies].
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The registry compares library versions and framework requirements
# (`registry/`), already in the workspace lock through the framework.
semver = "1"
# The registry verifies each third-party component's Ed25519 signature over
# its verification hash, and lets an author sign one (`registry/signing.rs`).
# Pure Rust; its build runs only `rustc` (curve25519-dalek's build script
# asks `rustc` for its version).
ed25519-dalek = "2.2"
# The registry edits `suprnova.toml` in place, keeping every comment, key
# order and table it does not own byte for byte (`registry/project.rs`).
# Already in the workspace lock through `proc-macro-crate`.
toml_edit = "0.25"
# The registry fetches a library's files over HTTPS (`registry/fetch.rs`).
# The same reqwest the framework uses, without its default provider:
# `ring`, which the CLI already builds through sqlx, is installed as the
# rustls provider, so no second TLS crypto library enters the CLI's build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The component scan reads a vendored view's template expressions with
# Askama's own parser (REG-031); the same version the Live crate pins.
askama_parser = "=0.16.0"
# The component scan tokenizes stylesheets, `style` elements and `style`
# attributes (REG-031); already in the lock through the Live crate.
cssparser = "0.37"
# The component scan runs `live:check`'s view checker on a vendored
# component's views against the contract read from its Rust syntax, without
# compiling the application (REG-022). The Live engine crate holds the
# checker; it is the framework's engine, not the framework.
suprnova-live = { path = "../crates/suprnova-live", version = "3.2.1" }
# `ssr:start`, `ssr:stop` and `ssr:check` run the framework's own
# implementation, `suprnova::console::ssr`, the one the application binary's
# commands run, so the two cannot drift (PAR-061). Without the default
# features: the commands use none of the framework's drivers.
suprnova = { path = "../framework", version = "3.2.1", default-features = false }
# The component scan parses a vendored script as a JavaScript module and
# walks its syntax tree (REG-032). Pure Rust; pinned to 0.139, the newest
# release whose MSRV (1.94) the workspace meets.
oxc_allocator = "=0.139.0"
oxc_ast = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_span = "=0.139.0"
oxc_syntax = "=0.139.0"

# The Live tooling helper runs in its own process group so a timeout can
# kill everything it started, and an interrupt is forwarded to that group
# (`commands/live_tool.rs`).
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
# Verify generated keys round-trip through the framework's loader.
suprnova = { path = "../framework", version = "3.2.1" }
# Integration tests that invoke the binary with a temp working directory.
tempfile = "3"
