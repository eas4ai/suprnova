[package]
name = "suprnova-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for scaffolding Suprnova web applications"
repository = "https://github.com/eas4ai/suprnova"
homepage = "https://github.com/eas4ai/suprnova"
keywords = ["cli", "scaffold", "suprnova", "web", "generator"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "suprnova"
path = "src/main.rs"
# Skip rustdoc for the bin — the lib at `framework/suprnova` already
# emits docs at `target/doc/suprnova/`, and rustdoc tries to write
# this bin's doc to the same path (cargo issue #6313). The CLI's
# user-facing reference is `suprnova --help`, not docs.rs.
doc = false

[lib]
name = "suprnova_cli"
path = "src/lib.rs"
doctest = false

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
console = "0.16"
ctrlc = "3.5"
syn = { version = "2", features = ["full", "parsing", "visit"] }
walkdir = "2"
notify = "8.2"
notify-debouncer-mini = "0.7"
dotenvy = "0.15"
# `generate-types` parses `lang/<locale>/*.ftl` catalogs into the
# `MessageKey` TS union (see `commands/generate_types.rs`). Independent of
# the framework's own (optional) `fluent-syntax` dep — the CLI can't
# depend on the `suprnova` crate at runtime (see the `rand`/`base64`
# comment above), so this is its own minimal parse-only dependency.
fluent-syntax = "0.12"
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
chrono = "0.4"
toml = "1.1.2"
regex = "1"
# `key:generate` mints a 32-byte AES-256 key encoded URL-safe-no-pad
# base64 — same wire format as `suprnova::EncryptionKey::to_base64`.
# We duplicate the six primitives instead of pulling `suprnova` into
# the CLI binary, which would drag every framework transitive dep
# along (`tokio`-full + `reqwest` + SeaORM, etc).
rand = "0.10.1"
base64 = "0.22"
getrandom = "0.4.2"
# `dev:tls` fingerprints the CA certificate before installing it into a
# browser trust store, and pins that fingerprint so a CA that changes
# underneath the user has to be re-confirmed by a human.
sha2 = "0.10"

[dev-dependencies]
# Verify generated keys round-trip through the framework's loader.
suprnova = { path = "../framework", version = "1.2.4" }
# Integration tests that invoke the binary with a temp working directory.
tempfile = "3"
# `docker_scaffold` reads `cargo metadata` output to assert the generated
# manifest resolves a default binary.
serde_json = "1"
