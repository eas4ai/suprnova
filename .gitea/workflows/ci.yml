name: CI

# Runs on the Gitea runners (runner-1, the Mac and the Windows tablet) when a
# lane branch reaches git.stonedoubtstudio.com, so a lane is checked before it
# merges and never has to reach GitHub. GitHub ignores this directory.
on:
  push:
    branches:
      - "lane/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Warnings are reported, never denied: toolchain and dependency drift must
  # not become a hard error. rust-toolchain.toml selects the compiler, so the
  # runner's default toolchain is left alone.
  linux:
    name: fmt, clippy and tests (Linux)
    runs-on: [self-hosted, rust-ci, Linux]
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
      - name: Install nextest
        run: cargo install cargo-nextest --locked
      - name: Workspace tests
        run: cargo nextest run --workspace --no-fail-fast

  other:
    name: tests (${{ matrix.os }})
    runs-on: [self-hosted, rust-ci, "${{ matrix.os }}"]
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        os: [macOS, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install nextest
        run: cargo install cargo-nextest --locked
      - name: Workspace tests
        run: cargo nextest run --workspace --no-fail-fast
