[package]
name = "suprnova-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
description = "Internal Suprnova Live interaction engine"
repository = "https://github.com/eas4ai/suprnova"
publish = false

[workspace]
resolver = "3"
members = [
    ".",
    "crates/suprnova-live-macro-fixture",
    "crates/suprnova-live-macros",
    "crates/suprnova-live-test-support",
]
exclude = ["fuzz"]

[features]
default = []

[dependencies]
askama = "=0.16.0"
askama_parser = "=0.16.0"
async-trait = "=0.1.92"
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
bytes = "=1.11.1"
getrandom = { version = "=0.4.3", features = ["std"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
html5ever = "=0.39.0"
http = "=1.4.1"
imagesize = { version = "=0.15.0", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
thiserror = "=2.0.20"
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde"] }
uuid = { version = "=1.23.1", features = ["serde"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
hex-literal = "=1.1.0"
proptest = "=1.11.0"
suprnova-live-test-support = { path = "crates/suprnova-live-test-support" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[[bench]]
name = "snapshot_budget"
harness = false

[[bench]]
name = "action_framework_budget"
harness = false

[[bench]]
name = "upload_framework_budget"
harness = false
