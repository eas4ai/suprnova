[profile.default]
status-level = "fail"
failure-output = "immediate"

[profile.ci]
fail-fast = false

[test-groups]
serial-binaries = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(paginated_users_e2e)'
test-group = 'serial-binaries'

# A real-clock fairness assertion over an SSE transport: it holds when the
# machine is not saturated by other test processes, so it runs alone.
[[profile.default.overrides]]
filter = 'binary(live_async_backpressure) & test(=a_chatty_island_cannot_starve_its_sibling_on_one_transport)'
threads-required = "num-test-threads"
