[package]
name = "suprnova-live-test-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
description = "Development-only conformance support for Suprnova Live"
repository = "https://github.com/eas4ai/suprnova"
publish = false

[features]
default = []

[dependencies]
async-trait = "=0.1.92"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
suprnova-live = { path = "../.." }
tokio = { version = "=1.53.1", features = ["fs", "io-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
