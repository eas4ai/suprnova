[package]
name = "suprnova-live-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Internal procedural macros for Suprnova Live development"
repository = "https://github.com/eas4ai/suprnova"
publish = false

[lib]
proc-macro = true

[features]
default = []

[dependencies]
proc-macro2 = "=1.0.106"
quote = "=1.0.45"
syn = { version = "=2.0.117", features = ["extra-traits", "full"] }

[dev-dependencies]
suprnova = { package = "suprnova-live-macro-fixture", path = "../suprnova-live-macro-fixture" }
trybuild = "=1.0.120"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
