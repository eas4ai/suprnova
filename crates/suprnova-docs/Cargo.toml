[package]
name = "suprnova-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application-owned documentation sites, Markdown twins, browser search and agent read tools"

[dependencies]
suprnova = { path = "../../framework", version = "4.6.2", default-features = false, features = ["agents"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false }
tokio = { version = "1", features = ["rt"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

[dev-dependencies]
suprnova = { path = "../../framework", default-features = false, features = ["agents", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
